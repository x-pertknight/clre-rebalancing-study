name: reproduce

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check pdftotext is available
        run: pdftotext -v
      - name: Reproduce offline
        run: bash reproduce.sh
