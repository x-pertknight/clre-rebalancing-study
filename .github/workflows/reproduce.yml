name: reproduce

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pdftotext (poppler) is not on the runner image. This package install is the
      # only network step; reproduce.sh itself runs offline.
      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils
      - name: Reproduce offline
        run: bash reproduce.sh
